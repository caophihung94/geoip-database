name: Auto Update GeoIP & IP2Location

on:
  schedule:
    - cron: '0 3 2 * *'
  workflow_dispatch:

permissions:
  contents: write

env:
  MAXMIND_EDITIONS: "GeoLite2-City GeoLite2-Country GeoLite2-ASN"
  IP2LOCATION_CODES: "DB11LITEBINIPV6"

jobs:
  update-databases:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Tải và giải nén MaxMind GeoIP (.mmdb)
        env:
          LICENSE_KEY: ${{ secrets.MAXMIND_LICENSE_KEY }}
        run: |
          mkdir -p /tmp/geoip-dist
          for edition in $MAXMIND_EDITIONS; do
            echo "Đang tải $edition..."
            curl -fsSL "https://download.maxmind.com/app/geoip_download?edition_id=${edition}&license_key=${LICENSE_KEY}&suffix=tar.gz" -o /tmp/maxmind.tar.gz
            
            # Đặt -C /tmp/geoip-dist/ lên trước '*.mmdb' để giải nén đúng vào thư mục đích
            tar -xzf /tmp/maxmind.tar.gz -C /tmp/geoip-dist/ --strip-components=1 --wildcards --no-anchored '*.mmdb'
            rm -f /tmp/maxmind.tar.gz
          done
          ls -lh /tmp/geoip-dist/

      - name: Tải và giải nén IP2Location (.BIN)
        env:
          TOKEN: ${{ secrets.IP2LOCATION_TOKEN }}
        run: |
          mkdir -p /tmp/geoip-dist
          for code in $IP2LOCATION_CODES; do
            echo "Đang tải $code..."
            curl -fsSL "https://www.ip2location.com/download/?token=${TOKEN}&file=${code}" -o /tmp/ip2loc.zip
            
            if ! file /tmp/ip2loc.zip | grep -q "Zip archive"; then
              echo "Lỗi: Phản hồi từ IP2Location không phải file ZIP:"
              head -c 300 /tmp/ip2loc.zip
              exit 1
            fi
            
            unzip -j -o /tmp/ip2loc.zip "*.BIN" -d /tmp/geoip-dist/
            rm -f /tmp/ip2loc.zip
          done
          ls -lh /tmp/geoip-dist/

      - name: Đăng tải toàn bộ file lên GitHub Releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest /tmp/geoip-dist/* \
            --title "Latest GeoIP & IP2Location ($(date -u +'%Y-%m-%d'))" \
            --notes "Cập nhật tự động định kỳ hàng tháng bằng GitHub Actions."

      - name: Ghi log cập nhật nhẹ vào nhánh main
        run: |
          echo "Last updated: $(date -u +'%Y-%m-%d %H:%M:%S UTC')" > last-updated.txt
          echo "" >> last-updated.txt
          echo "Files & SHA256 Checksums:" >> last-updated.txt
          (cd /tmp/geoip-dist && sha256sum * >> "$GITHUB_WORKSPACE/last-updated.txt")
          
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add last-updated.txt
          git diff --staged --quiet || git commit -m "chore: update database checksums ($(date -u +'%Y-%m-%d'))"
          git push origin main
